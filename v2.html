<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENA — V2 Talking SENA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#0d76c4; --ink-soft:#1a8fd6; --orange:#e07b1a; --orange-soft:#fdf0e0;
         --orange-line:#e8943f; --green:#2a7a2a; --red:#b03a2e; --paper:#fbfaf7; --line:#d9d6cc; --base:17px; }
  *{box-sizing:border-box;}
  body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);line-height:1.6;
       max-width:1040px;margin:0 auto;padding:0 24px 40px;background:var(--paper);font-size:var(--base);}
  h1{font-size:28px;margin:18px 0 2px;} h3{font-size:18px;margin-top:8px;color:var(--ink-soft);}
  .lede{color:#5a6573;font-size:16px;margin-top:4px;}
  .menubar{position:sticky;top:0;background:var(--ink);margin:0 -24px 14px;padding:11px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:10;}
  .menubar .brand{color:#fff;font-weight:bold;font-size:19px;margin-right:14px;}
  .menubar a{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;color:#cdd8e4;text-decoration:none;padding:7px 13px;border-radius:7px;}
  .menubar a:hover{background:#22344e;color:#fff;} .menubar a.active{background:var(--orange);color:#fff;} .menubar a.new{background:#fff;color:var(--ink);}
  .menubar .who{margin-left:auto;color:#9fb0c2;font-family:Arial,sans-serif;font-size:12.5px;} .menubar .who a{color:#cdd8e4;}
  .status{display:inline-block;background:var(--green);color:#fff;font-size:13px;padding:4px 12px;border-radius:3px;font-family:Arial,sans-serif;letter-spacing:.5px;}
  .filterbar{font-family:Arial,sans-serif;font-size:13px;margin:14px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .chip{padding:4px 11px;border-radius:14px;border:2px solid var(--line);cursor:pointer;font-weight:bold;background:#fff;color:#666;}
  .chip.on{border-color:var(--ink);color:var(--ink);background:#eef3f7;}
  .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .pd-confirmed{background:var(--green);} .pd-delayed{background:#d99000;} .pd-undecided{background:#888;} .pd-deferred{background:#7a5cc0;} .pd-removed{background:var(--red);}
  .tabbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;border-bottom:3px solid var(--ink);}
  .tab{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;padding:9px 14px;background:#ece8dd;color:var(--ink-soft);border:2px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;margin-bottom:-3px;}
  .tab.active{background:#fff;color:var(--ink);border-color:var(--ink);border-bottom:3px solid #fff;} .tab.removed{opacity:.55;text-decoration:line-through;}
  .panel{display:none;background:#fff;border:2px solid var(--ink);border-top:none;border-radius:0 0 8px 8px;padding:22px;} .panel.active{display:block;}
  .box{border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin:14px 0;background:#fff;}
  .why{background:#eef3f7;border-left:5px solid var(--ink);padding:12px 18px;margin:14px 0;border-radius:0 4px 4px 0;font-size:16px;}
  .outcome{font-family:Arial,sans-serif;font-weight:bold;font-size:17px;} .oc-alert{color:var(--red);} .oc-none{color:#5a6573;}
  .stoolbar{font-family:Arial,sans-serif;font-size:13px;background:#f6f3ea;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .stoolbar select{font-family:Arial,sans-serif;font-size:13px;padding:5px 8px;border:1.5px solid var(--line);border-radius:5px;} .stoolbar .stamp{color:#999;margin-left:auto;}
  .commentbox{width:100%;font-family:Arial,sans-serif;font-size:14px;padding:9px 12px;border:1.5px dashed var(--orange);border-radius:6px;margin:10px 0;background:#fffdf6;}
  .flow{margin:16px 0;}
  .fnode{display:block;max-width:520px;margin:0 auto;background:var(--orange-soft);border:2.5px solid var(--orange);border-radius:8px;padding:11px 16px;font-family:Arial,sans-serif;text-align:center;}
  .fnode .t{color:var(--ink);font-weight:bold;font-size:16px;} .fnode .s{color:var(--ink-soft);font-size:13.5px;display:block;margin-top:2px;}
  .fnode.start{background:var(--ink);border-color:var(--ink);} .fnode.start .t{color:#fff;}
  .fnode.decision{background:#fff6e9;border-style:dashed;} .fnode.terminal{background:#fbe4df;border-color:var(--red);} .fnode.terminal .t{color:var(--red);}
  .farrow{text-align:center;color:var(--orange-line);font-weight:bold;font-size:22px;margin:3px 0;}
  .empty{font-family:Arial,sans-serif;color:#999;padding:30px;text-align:center;}
</style>
</head>
<body>

<div class="menubar">
  <span class="brand">SENA</span>
  <a href="demonstrator.html">Home</a>
  <a href="v1.html">V1</a>
  <a href="v2.html" class="active">V2</a><a href="v3.html">V3</a><a href="v4.html">V4</a>
  <a href="create.html" class="new">＋ Create New</a>
  <span class="who" id="who"></span>
</div>

<span class="status">🔵 V2 — TALKING SENA (NEXT)</span>
<h1>V2 — Talking SENA & Front Desk</h1>
<p class="lede">Scenarios for the visitor talking-guard & SENA-FD. Each tab is one scenario. To add one, use Create New and tag it V1.</p>

<div class="filterbar"><span style="color:#888">Show:</span>
  <span class="chip on" data-f="confirmed" onclick="tf(this)"><span class="pdot pd-confirmed"></span>Confirmed</span>
  <span class="chip on" data-f="delayed" onclick="tf(this)"><span class="pdot pd-delayed"></span>Delayed</span>
  <span class="chip on" data-f="undecided" onclick="tf(this)"><span class="pdot pd-undecided"></span>Not decided</span>
  <span class="chip on" data-f="deferred" onclick="tf(this)"><span class="pdot pd-deferred"></span>Deferred</span>
  <span class="chip" data-f="removed" onclick="tf(this)"><span class="pdot pd-removed"></span>Removed</span>
</div>
<div class="tabbar" id="tabbar"></div>
<div id="panels"></div>

<script>
const SUPABASE_URL="https://bzwdvdbmpurqqpntrcio.supabase.co";
const SUPABASE_KEY="sb_publishable_6YrFzgL6-Whlft8lofg5Nw_jxIsPz_t";
const VERSION="v2";   // <<< this page's version
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PRIO=['confirmed','delayed','undecided','deferred','removed'];
const PL={confirmed:'Confirmed',delayed:'Delayed',undecided:'Not decided',deferred:'Deferred',removed:'Removed'};
let isAdmin=false,currentUserId=null,scenarios=[],current=0,filters=new Set(['confirmed','delayed','undecided','deferred']);
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// ---- standard-symbol SVG flowchart renderer ----
function svgFlow(nodes){
  if(!nodes||!nodes.length) return '';
  const W=520, padX=18, gapY=26, lblH=18;
  const esc2=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function wrap(t,max){t=(t||'').toString();const w=t.split(/\s+/);const lines=[];let cur='';
    w.forEach(x=>{if((cur+' '+x).trim().length>max){if(cur)lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();});if(cur)lines.push(cur);return lines.slice(0,3);}
  // measure heights
  const items=nodes.map(n=>{const lines=wrap(n.t,38);const h=Math.max(46, lines.length*18+22);return {n,lines,h};});
  let totalH=10; items.forEach((it,i)=>{ totalH+=it.h; if(i<items.length-1) totalH+=gapY+(items[i+1].n.s?lblH:0); });
  totalH+=14;
  let y=10, svg='<svg viewBox="0 0 '+W+' '+totalH+'" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width:560px;display:block;margin:0 auto;font-family:Arial">';
  svg+='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1a8fd6" stroke-width="1.6"/></marker></defs>';
  const cx=W/2;
  items.forEach((it,i)=>{
    const n=it.n, h=it.h, type=n.type;
    const fill = type==='terminal' ? '#fbe4df' : type==='decision' ? '#fff6e9' : type==='start' ? '#0d76c4' : type==='io' ? '#eef7ff' : '#fdf0e0';
    const stroke = type==='terminal' ? '#b03a2e' : type==='start' ? '#0d76c4' : '#e07b1a';
    const tcol = type==='start' ? '#ffffff' : type==='terminal' ? '#b03a2e' : '#16243a';
    const w = 300, x = cx - w/2, top=y;
    if(type==='start'||type==='terminal'){ // stadium
      svg+='<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+h+'" rx="'+(h/2)+'" ry="'+(h/2)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>';
    } else if(type==='decision'){ // diamond
      const mx=cx, my=top+h/2; const dw=w/2+20, dh=h/2+8;
      svg+='<polygon points="'+mx+','+(my-dh)+' '+(mx+dw)+','+my+' '+mx+','+(my+dh)+' '+(mx-dw)+','+my+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>';
    } else if(type==='io'){ // parallelogram
      const sk=22;
      svg+='<polygon points="'+(x+sk)+','+top+' '+(x+w)+','+top+' '+(x+w-sk)+','+(top+h)+' '+x+','+(top+h)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>';
    } else { // process rectangle
      svg+='<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+h+'" rx="6" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>';
    }
    const startY=top+h/2-((it.lines.length-1)*9);
    it.lines.forEach((ln,li)=>{ svg+='<text x="'+cx+'" y="'+(startY+li*18+5)+'" text-anchor="middle" font-size="14" font-weight="bold" fill="'+tcol+'">'+esc2(ln)+'</text>'; });
    y=top+h;
    if(i<items.length-1){
      const ny=y+gapY+(items[i+1].n.s?lblH:0);
      svg+='<line x1="'+cx+'" y1="'+y+'" x2="'+cx+'" y2="'+(ny-2)+'" stroke="#1a8fd6" stroke-width="1.8" marker-end="url(#ah)"/>';
      if(items[i+1].n.s){ svg+='<text x="'+(cx+8)+'" y="'+(y+gapY/2+4)+'" text-anchor="start" font-size="12" font-weight="bold" fill="#1a8fd6">'+esc2(items[i+1].n.s)+'</text>'; }
      y=ny;
    }
  });
  svg+='</svg>';
  return svg;
}

function getTok(){let t=localStorage.getItem('sena_device_token');if(!t){t='dev_'+crypto.randomUUID();localStorage.setItem('sena_device_token',t);}return t;}
function bounce(m){document.body.innerHTML='<div style="font-family:Arial;max-width:520px;margin:80px auto;padding:30px;background:#fdf0ee;border:2px solid #b03a2e;border-radius:12px;color:#8a2a1c;text-align:center;"><h2>🚫 Sign-in required</h2><p>'+m+'</p><a href="index.html" style="display:inline-block;margin-top:10px;background:#16243a;color:#fff;padding:11px 22px;border-radius:8px;text-decoration:none;font-weight:bold;">Go to sign in</a></div>';}

async function guard(){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ bounce('You are not signed in.'); return false; }
  currentUserId=session.user.id;
  const myTok=getTok(); let prof;
  try{ const r=await sb.from('profiles').select('approved,is_admin,bound_device_id,email').eq('id',currentUserId).single(); prof=r.data; }
  catch(e){ bounce('Could not verify your account.'); return false; }
  if(!prof||!prof.approved){ bounce('Your access is not approved.'); return false; }
  if(prof.bound_device_id && prof.bound_device_id!==myTok){ await sb.auth.signOut(); bounce('This account is locked to another browser/device.'); return false; }
  isAdmin=!!prof.is_admin;
  document.getElementById('who').innerHTML=prof.email+(isAdmin?' · ADMIN':'')+' &nbsp;<a href="#" onclick="so()">sign out</a>';
  return true;
}
async function so(){ await sb.auth.signOut(); location.href='index.html'; }

async function load(){
  const { data,error }=await sb.from('scenarios').select('*').eq('version',VERSION).order('created_at',{ascending:true});
  if(!error && data) scenarios=data.map(r=>({...r.data,priority:r.priority||r.data.priority,_id:r.id}));
  render();
}
function tf(el){const f=el.dataset.f;if(filters.has(f)){filters.delete(f);el.classList.remove('on');}else{filters.add(f);el.classList.add('on');}render();}
function render(){
  const tb=document.getElementById('tabbar'),pn=document.getElementById('panels');tb.innerHTML='';pn.innerHTML='';
  const vis=scenarios.filter(s=>filters.has(s.priority));
  if(vis.length===0){ pn.innerHTML='<div class="empty">No scenarios for this view. Add one via ＋ Create New (tag it '+VERSION.toUpperCase()+').</div>'; return; }
  scenarios.forEach((sc,i)=>{
    if(!filters.has(sc.priority))return;
    const t=document.createElement('div');t.className='tab'+(i===current?' active':'')+(sc.priority==='removed'?' removed':'');
    t.innerHTML='<span class="pdot pd-'+sc.priority+'"></span>'+esc(sc.name);t.onclick=()=>{current=i;render();};tb.appendChild(t);
    const p=document.createElement('div');p.className='panel'+(i===current?' active':'');
    let flow=svgFlow(sc.nodes||[]);
    p.innerHTML='<div class="stoolbar"><span>Priority:</span><select onchange="setPrio('+i+',this.value)" '+(isAdmin||sc.priority!=='confirmed'?'':'disabled')+'>'+
      PRIO.map(pr=>'<option value="'+pr+'"'+(pr===sc.priority?' selected':'')+'>'+PL[pr]+'</option>').join('')+'</select>'+
      '<span class="stamp">'+VERSION.toUpperCase()+'</span></div>'+
      '<h3>'+esc(sc.name)+'</h3><div class="box"><b>Situation:</b> '+esc(sc.situation)+'</div>'+
      '<p>Outcome: <span class="outcome '+(sc.outcomeClass||'oc-alert')+'">→ '+esc(sc.outcome)+'</span></p>'+flow+
      '<div class="why"><b>Why:</b> '+esc(sc.why)+'</div>'+
      '<label style="font-family:Arial;font-size:13px;color:#7a5a14;font-weight:bold;">Board comment:</label>'+
      '<textarea class="commentbox" rows="2" oninput="setComment('+i+',this.value)">'+esc(sc.comment)+'</textarea>';
    pn.appendChild(p);
  });
}
async function persist(sc){
  try{ await sb.from('scenarios').update({data:sc,priority:sc.priority,last_edited_by:currentUserId,updated_at:new Date().toISOString()}).eq('id',sc._id);
    await sb.rpc('log_audit',{p_action:'edited scenario',p_detail:sc.name}); }catch(e){}
}
function setPrio(i,v){ if(scenarios[i].priority==='confirmed'&&!isAdmin){alert('Only admin can change a Confirmed scenario.');render();return;} scenarios[i].priority=v;persist(scenarios[i]);render(); }
function setComment(i,v){ scenarios[i].comment=v; clearTimeout(window._ct);window._ct=setTimeout(()=>persist(scenarios[i]),800); }

(async()=>{ if(await guard()) load(); })();
</script>
</body>
</html>
